server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Proxy the REST API (and Swagger UI) to the backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Raw OpenAPI spec (does not match the /api/ prefix above)
    location = /api-docs.json {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA fallback: all routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The frontend serves source ES modules / CSS under stable, un-hashed
    # paths (e.g. /js/components/select.js) — a rebuild changes the file but
    # not the URL, so always revalidate (ETag/Last-Modified) instead of caching
    # aggressively: otherwise browsers keep stale JS/CSS for up to an hour.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico)$ {
        expires 0;
        add_header Cache-Control "no-cache";
    }
}
